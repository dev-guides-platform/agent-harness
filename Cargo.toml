[package]
name = "agent-harness"
version = "0.1.0"
edition = "2021"
description = "A minimal, security-hardened AI coding harness in Rust with sandboxed tools, observation bounding, verification gates, and JSONL trajectory logging."
license = "MIT"

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.10", features = ["json"] }

[dev-dependencies]
tempfile = "3.14"
